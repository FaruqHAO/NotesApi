services:
  api:
    build: .
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PORT: "8080"
      MongoDBSettings__ConnectionString: ${MongoDBSettings__ConnectionString:?Set MongoDBSettings__ConnectionString in Dokploy}
      MongoDBSettings__DatabaseName: ${MongoDBSettings__DatabaseName:-NotesDB}
      MongoDBSettings__NotesCollectionName: Notes
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in Dokploy Environment}
      Jwt__Issuer: https://notes.baosat.dpdns.org
      Jwt__Audience: https://notes.baosat.dpdns.org
    networks: [dokploy-network]
    labels:
      - traefik.docker.network=dokploy-network
networks:
  dokploy-network:
    external: true
